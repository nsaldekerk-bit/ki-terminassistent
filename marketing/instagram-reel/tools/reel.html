<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Westfalia Digital Reel</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>
  :root { --royal: #1f6fff; --royal-light: #5b9bff; --navy: #071a35; --ink: #040b18; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ink); }
  body { font-family: Inter, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  #frame { position: absolute; inset: 0; overflow: hidden; }
  .layer { position: absolute; inset: 0; }

  /* background: deep navy with two slow soft light sources */
  #bg { background: linear-gradient(180deg, #0a1f40 0%, #071a35 38%, #040d1d 100%); }
  .glow { position: absolute; border-radius: 50%; }
  #vignette { background: radial-gradient(120% 85% at 50% 45%, rgba(0,0,0,0) 60%, rgba(0,0,0,.35) 100%); }

  /* devices */
  .phone { position: absolute; width: 736px; height: 1551px; border-radius: 104px; padding: 18px;
    background: linear-gradient(150deg, #3a4558 0%, #11161f 22%, #0b0f17 70%, #2a3345 100%);
    box-shadow: 0 90px 160px -40px rgba(0,0,0,.8), 0 0 0 2px #465368 inset, 0 0 0 1px #05070b; transform-origin: 50% 50%; }
  .phone .screen { position: relative; width: 700px; height: 1515px; border-radius: 86px; overflow: hidden; background: #0b1526; }
  .phone .screen img { position: absolute; left: 0; top: 0; width: 700px; height: 1515px; }
  .phone .island { position: absolute; left: 50%; top: 40px; width: 180px; height: 52px; margin-left: -90px; border-radius: 26px; background: #000; }
  .phone .glare { position: absolute; inset: 18px; border-radius: 86px;
    background: linear-gradient(120deg, rgba(255,255,255,0) 35%, rgba(255,255,255,.07) 48%, rgba(255,255,255,0) 60%); background-size: 300% 100%; }
  .phone .btn { position: absolute; background: #222b3a; border-radius: 3px; }

  .browser { position: absolute; width: 980px; border-radius: 22px; overflow: hidden; background: #0e1b31; transform-origin: 50% 50%;
    box-shadow: 0 70px 140px -30px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.1); }
  .browser .bar { height: 58px; background: #15223a; display: flex; align-items: center; padding: 0 22px; gap: 10px; }
  .browser .bar i { width: 15px; height: 15px; border-radius: 50%; display: block; background: #34425c; }
  .browser .url { margin: 0 auto; width: 420px; height: 34px; border-radius: 17px; background: #0b1526; color: #b9ccef;
    font: 500 18px Inter; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .browser img { display: block; width: 980px; height: 612.5px; }

  /* titles */
  .title { position: absolute; left: 60px; right: 60px; text-align: center; }
  .eyebrow { font: 700 25px Inter; letter-spacing: .2em; color: #8db8ff; text-transform: uppercase; overflow: hidden; height: 34px; }
  .eyebrow span, .tl span { display: inline-block; will-change: transform; }
  .tl { overflow: hidden; font-family: Montserrat; font-weight: 800; letter-spacing: -.02em; line-height: 1.08; padding: 0 0 .1em; white-space: nowrap; }
  .tl b { font-weight: 800; color: var(--royal-light); }
  .sub { font: 500 30px Inter; color: rgba(214,228,255,.82); overflow: hidden; line-height: 1.35; white-space: nowrap; }

  .progress { display: flex; gap: 10px; justify-content: center; margin: 18px 0 10px; }
  .progress i { display: block; width: 92px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.16); overflow: hidden; }
  .progress i b { display: block; height: 100%; width: 0; background: var(--royal-light); border-radius: 3px; }

  .cta { position: absolute; left: 540px; width: 640px; height: 132px; margin-left: -320px; border-radius: 66px;
    background: linear-gradient(180deg, #3a82ff 0%, #1f6fff 60%, #1a62e6 100%);
    display: flex; align-items: center; justify-content: center; gap: 22px; font: 800 48px Montserrat; letter-spacing: -.01em;
    box-shadow: 0 30px 70px -22px rgba(31,111,255,.85), inset 0 1px 0 rgba(255,255,255,.25); overflow: hidden; }
  .cta svg { width: 50px; height: 50px; }
  .shine { position: absolute; top: 0; bottom: 0; width: 160px; transform: skewX(-20deg);
    background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.35), rgba(255,255,255,0)); }

  .tap { position: absolute; width: 70px; height: 70px; margin: -35px 0 0 -35px; border-radius: 50%;
    background: rgba(255,255,255,.35); box-shadow: 0 0 0 3px rgba(255,255,255,.85), 0 6px 18px rgba(0,0,0,.25); }
  .tapring { position: absolute; border-radius: 50%; border: 3px solid rgba(255,255,255,.9); }

  .check { position: absolute; left: 480px; width: 120px; height: 120px; border-radius: 50%; background: #22c55e;
    box-shadow: 0 22px 50px -14px rgba(34,197,94,.75); }
  .check svg { position: absolute; left: 0; top: 0; width: 120px; height: 120px; }

  .opts { position: absolute; left: 0; right: 0; display: flex; justify-content: center; gap: 34px; font: 600 30px Inter; color: rgba(235,242,255,.92); }
  .opts span { display: inline-flex; align-items: center; gap: 12px; }
  .opts svg { width: 30px; height: 30px; color: #4ade80; }
  #fade { background: #040b18; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <filter id="mb" x="-10%" y="-5%" width="120%" height="110%"><feGaussianBlur id="mbStd" stdDeviation="0 0"/></filter>
</defs></svg>
<div id="frame">
  <div id="bg" class="layer"></div>
  <div id="world" class="layer"></div>
  <div id="ui" class="layer"></div>
  <div id="vignette" class="layer"></div>
  <div id="fade" class="layer" style="opacity:0"></div>
</div>
<script>
// =====================================================================
//  Basics
// =====================================================================
const FPS = 30, DURATION = 32, BPM = 120, BEAT = 0.5;
const CLIPS = { c_hero: 80, c_dhero: 80, c_leist: 80, c_auto: 80, c_check: 80, c_team: 80, m_booking: 330 };
const SCR = 700 / 390;
const BOOK_T0 = 16.0;
const bt = (f) => BOOK_T0 + f / 30;
const DONE_T = bt(264);

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  inOut: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
  out: (t) => 1 - Math.pow(1 - t, 3),
  in: (t) => t * t * t,
  outExpo: (t) => (t >= 1 ? 1 : 1 - Math.pow(2, -10 * t)),
  inOutQuint: (t) => (t < 0.5 ? 16 * t ** 5 : 1 - Math.pow(-2 * t + 2, 5) / 2),
  outBackSoft: (t) => { const c1 = 1.2, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
};
const el = (tag, cls, parent, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (parent) parent.appendChild(e); return e; };
const css = (e, o) => { for (const k in o) e.style[k] = o[k]; };
const show = (e, on) => { e.style.display = on ? '' : 'none'; };
const clipURL = (n, i) => `clips/${n}/${String(clamp(Math.round(i), 0, CLIPS[n] - 1)).padStart(4, '0')}.jpg`;
const pending = [];
function setSrc(img, url) { if (img.dataset.src !== url) { img.dataset.src = url; img.src = url; pending.push(img.decode().catch(() => {})); } }

const ICON = {
  cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M8 3v4"/><path d="M16 3v4"/></svg>',
  tick: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.2 4.2L19 7"/></svg>',
  lock: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#7fa6e0" stroke-width="2.4" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
  logo: (s) => `<svg viewBox="0 0 48 48" width="${s}" height="${s}"><defs><linearGradient id="lg${s}" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#1657D6"/><stop offset="1" stop-color="#3D86FF"/></linearGradient></defs><circle cx="24" cy="24" r="24" fill="#F4F7FB"/><path d="M13 16 L19.5 33 L24 23 L28.5 33" fill="none" stroke="#0B1B33" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M28.5 33 L37 12" fill="none" stroke="url(#lg${s})" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
};

// Sound events share this timeline (exported as SFX for audio2.py)
const SFX = [];
const sfx = (t, type, gain = 1, extra = {}) => SFX.push({ t: +t.toFixed(4), type, gain, ...extra });

async function boot() {
await Promise.all(['600', '700', '800'].map((w) => document.fonts.load(`${w} 60px Montserrat`, 'ÄÖÜäöüß Termin'))
  .concat(['400', '500', '600', '700'].map((w) => document.fonts.load(`${w} 30px Inter`, 'westfaliadigital.de ÄÖÜ'))));
await document.fonts.ready;

const world = document.getElementById('world');
const ui = document.getElementById('ui');
const scrim = el('div', 'layer', ui);
scrim.style.background = 'linear-gradient(180deg, rgba(5,14,30,1) 0%, rgba(5,14,30,1) 28.8%, rgba(5,14,30,0) 31%)';
const bg = document.getElementById('bg');

// ---------------------------------------------------------------------
//  Background light
// ---------------------------------------------------------------------
const glows = [
  { c: 'rgba(31,111,255,.42)', r: 700, x: 540, y: 1180, ax: 120, ay: 60, sp: 0.07 },
  { c: 'rgba(91,155,255,.20)', r: 520, x: 200, y: 320, ax: 80, ay: 50, sp: 0.05 },
].map((g) => { const d = el('div', 'glow', bg); css(d, { width: 2 * g.r + 'px', height: 2 * g.r + 'px', background: `radial-gradient(closest-side, ${g.c}, rgba(0,0,0,0))` }); return { ...g, d }; });
function renderBg(t) {
  for (const g of glows) css(g.d, { left: (g.x - g.r + Math.sin(t * g.sp * 6.283) * g.ax) + 'px', top: (g.y - g.r + Math.cos(t * g.sp * 5.1) * g.ay) + 'px' });
}

// ---------------------------------------------------------------------
//  Titles with masked line reveals
// ---------------------------------------------------------------------
const titles = [];
/** {t0, t1, y, eyebrow, lines:[html], size, sub, progress:{step}} */
function title(def) {
  const box = el('div', 'title', ui);
  box.style.top = def.y + 'px';
  const parts = [];
  if (def.eyebrow) { const e = el('div', 'eyebrow', box); parts.push({ span: el('span', '', e, def.eyebrow), d: 0 }); }
  if (def.progress) {
    const p = el('div', 'progress', box); def.bars = [];
    for (let i = 0; i < 5; i++) def.bars.push(el('b', '', el('i', '', p)));
    parts.push({ span: p, d: 0.02, fadeOnly: true });
  }
  const lineEls = def.lines.map((h, i) => { const l = el('div', 'tl', box); l.style.fontSize = (def.size || 84) + 'px'; const s = el('span', '', l, h); parts.push({ span: s, d: 0.06 + i * 0.07 }); return l; });
  if (def.sub) { const s = el('div', 'sub', box); s.style.marginTop = '14px'; parts.push({ span: el('span', '', s, def.sub), d: 0.2 }); }
  // one size for all lines that fits the widest
  let fs = def.size || 84;
  while (lineEls.some((l) => l.firstChild.offsetWidth > 960) && fs > 40) { fs -= 2; lineEls.forEach((l) => (l.style.fontSize = fs + 'px')); }
  def.box = box; def.parts = parts; titles.push(def); return def;
}
function renderTitle(d, t) {
  const on = t >= d.t0 - 0.01 && t < d.t1 + 0.45;
  show(d.box, on); if (!on) return;
  for (const p of d.parts) {
    const kin = E.outExpo(prog(t, d.t0 + p.d, d.t0 + p.d + 0.75));
    const kout = E.in(prog(t, d.t1 + p.d * 0.5, d.t1 + p.d * 0.5 + 0.32));
    if (p.fadeOnly) { p.span.style.opacity = kin * (1 - kout); continue; }
    p.span.style.transform = `translateY(${(1 - kin) * 105 - kout * 105}%)`;
  }
  if (d.progress) d.bars.forEach((b, i) => {
    const st = d.progress[i]; // [start, end] fill times
    b.style.width = (st ? E.inOut(prog(t, st[0], st[0] + 0.35)) * 100 : 0) + '%';
  });
}

// ---------------------------------------------------------------------
//  Devices
// ---------------------------------------------------------------------
function makePhone(parent) {
  const p = el('div', 'phone', parent);
  const scr = el('div', 'screen', p);
  const a = el('img', '', scr), b = el('img', '', scr);
  const taps = el('div', 'layer', scr);
  el('div', 'island', p);
  [[-5, 300, 110], [-5, 440, 110]].forEach(([x, y, h]) => { const d = el('div', 'btn', p); css(d, { left: x + 'px', top: y + 'px', width: '5px', height: h + 'px' }); });
  { const d = el('div', 'btn', p); css(d, { right: '-5px', top: '360px', width: '5px', height: '170px' }); }
  const glare = el('div', 'glare', p);
  return { root: p, a, b, taps, glare };
}
function placePhone(ph, { cx = 540, cy = 960, s = 1, rx = 0, ry = 0, rz = 0, op = 1, blur = 0 }) {
  css(ph.root, { left: (cx - 368) + 'px', top: (cy - 775.5) + 'px', opacity: op,
    transform: `perspective(3000px) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg) scale(${s})`,
    filter: blur > 0.4 ? 'url(#mb)' : 'none' });
  if (blur > 0.4) document.getElementById('mbStd').setAttribute('stdDeviation', `${blur} 0`);
  ph.glare.style.backgroundPosition = `${60 - ry * 3}% 0`;
}
/** Screen content: `cur` shown, `next` slides in from below as k goes 0→1. */
function setScreen(ph, cur, next, k) {
  setSrc(ph.a, cur);
  if (next && k > 0) {
    show(ph.b, true); setSrc(ph.b, next);
    const e = E.inOutQuint(k);
    css(ph.a, { transform: `translateY(${-e * 28}%)`, filter: `brightness(${1 - e * 0.5})` });
    css(ph.b, { transform: `translateY(${(1 - e) * 100}%)`, boxShadow: '0 -30px 60px rgba(0,0,0,.35)' });
  } else { show(ph.b, false); css(ph.a, { transform: 'none', filter: 'none' }); }
}
function makeBrowser(parent) {
  const b = el('div', 'browser', parent);
  const bar = el('div', 'bar', b); el('i', '', bar); el('i', '', bar); el('i', '', bar);
  el('div', 'url', bar, ICON.lock + 'westfaliadigital.de');
  return { root: b, img: el('img', '', b) };
}
function placeBrowser(br, { cx = 540, cy = 1000, s = 1, rx = 0, ry = 0, op = 1, blur = 0 }) {
  css(br.root, { left: (cx - 490) + 'px', top: (cy - 335) + 'px', opacity: op,
    transform: `perspective(2600px) rotateX(${rx}deg) rotateY(${ry}deg) scale(${s})`, filter: blur > 0.4 ? `blur(${blur * 0.25}px)` : 'none' });
}
function tapIndicator(parent) { return { d: el('div', 'tap', parent), r: el('div', 'tapring', parent) }; }
function animTap(tp, lt, x, y) {
  const vis = lt > -0.22 && lt < 0.5;
  show(tp.d, vis); show(tp.r, vis && lt > 0); if (!vis) return;
  const a = E.out(prog(lt, -0.22, 0));
  const press = lt >= 0 ? 1 - 0.12 * Math.sin(Math.min(1, lt / 0.16) * Math.PI) : 1;
  const out = prog(lt, 0.25, 0.5);
  css(tp.d, { left: x + 'px', top: y + 'px', opacity: a * (1 - out), transform: `scale(${lerp(1.3, 1, a) * press})` });
  const rk = E.out(prog(lt, 0, 0.45)), R = 34 + rk * 60;
  css(tp.r, { left: (x - R) + 'px', top: (y - R) + 'px', width: 2 * R + 'px', height: 2 * R + 'px', opacity: (1 - rk) * 0.8 });
}

// =====================================================================
//  Titles (all share the same slot at the top)
// =====================================================================
const TOP = 200;
title({ t0: -0.35, t1: 1.72, y: 690, eyebrow: 'Westfalia Digital', lines: ['Ihre Website bringt', 'keine <b>Anfragen?</b>'], size: 100 });
title({ t0: 2.05, t1: 3.75, y: TOP, eyebrow: 'westfaliadigital.de', lines: ['Ihre Digitalagentur', 'vom <b>Niederrhein.</b>'] });
title({ t0: 4.05, t1: 5.75, y: TOP, eyebrow: 'Marketing · Webseiten · Automatisierung', lines: ['Alles aus', '<b>einer Hand.</b>'] });
title({ t0: 6.05, t1: 7.75, y: TOP, eyebrow: 'Marketing', lines: ['Meta Ads, Google Ads', '& <b>Social Media.</b>'] });
title({ t0: 8.05, t1: 9.75, y: TOP, eyebrow: 'Automatisierung', lines: ['Anrufassistent &', '<b>Terminbuchung.</b>'] });
title({ t0: 10.05, t1: 11.75, y: TOP, eyebrow: 'Unverbindlich', lines: ['Kostenloser', '<b>Website-Check.</b>'] });
title({ t0: 12.05, t1: 13.75, y: TOP, eyebrow: 'Persönlich & regional', lines: ['Feste', '<b>Ansprechpartner.</b>'] });
title({ t0: 14.05, t1: 15.55, y: 690, eyebrow: 'Kostenlos & unverbindlich', lines: ['Lernen wir', 'uns <b>kennen?</b>'], size: 96 });

// Booking: constant eyebrow + progress, headline per step
const STEPS = [
  { a: 16.15, b: bt(52), h: 'Thema wählen', sub: 'Kostenloses Erstgespräch – zu Ihrem Thema' },
  { a: bt(52) + 0.12, b: bt(92), h: 'Wunschtag wählen' },
  { a: bt(92) + 0.12, b: bt(128), h: 'Uhrzeit wählen' },
  { a: bt(128) + 0.12, b: bt(226), h: 'Kontaktdaten eingeben' },
  { a: bt(226) + 0.12, b: DONE_T - 0.1, h: 'Prüfen & absenden' },
];
const fills = STEPS.map((s) => [s.a - 0.05]);
const bookHead = title({ t0: 16.15, t1: DONE_T - 0.1, y: 150, eyebrow: 'Terminanfrage · kostenlos & unverbindlich', lines: [], progress: fills });
const stepTitles = STEPS.map((s) => title({ t0: s.a, t1: s.b - 0.05, y: 238, lines: [s.h], size: 64, sub: s.sub }));

// Success
const okTitle = title({ t0: DONE_T + 0.55, t1: 27.7, y: 300, lines: ['Anfrage <b>gesendet.</b>'], size: 72, sub: 'Kostenlos & unverbindlich.' });
const check = el('div', 'check', ui, '<svg viewBox="0 0 120 120" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"><path d="M36 61 L53 78 L85 44" pathLength="1" stroke-dasharray="1" /></svg>');
const checkPath = check.querySelector('path');

// End card
const endLogo = el('div', '', ui, ICON.logo(150)); css(endLogo, { position: 'absolute', left: '465px', top: '500px', filter: 'drop-shadow(0 24px 50px rgba(31,111,255,.55))' });
const endTitle = title({ t0: 28.35, t1: 99, y: 700, eyebrow: 'Westfalia Digital', lines: ['Kostenloses', '<b>Erstgespräch</b> anfragen.'], size: 88 });
const opts = el('div', 'opts', ui, ['Website-Check', 'Erstgespräch', 'Beratung'].map((w) => `<span>${ICON.tick}${w}</span>`).join(''));
opts.style.top = '985px';
const optSpans = [...opts.children];
const cta = el('div', 'cta', ui, ICON.cal + '<span>Termin anfragen</span>'); const ctaShine = el('div', 'shine', cta);
const url = el('div', '', ui, 'westfaliadigital.de'); css(url, { position: 'absolute', left: 0, right: 0, textAlign: 'center', font: '700 42px Inter', color: '#fff', top: '1340px' });
const handle = el('div', '', ui, '@westfaliadigital'); css(handle, { position: 'absolute', left: 0, right: 0, textAlign: 'center', font: '500 30px Inter', color: '#8db8ff', top: '1400px' });

// =====================================================================
//  World: phone + browser
// =====================================================================
const browser = makeBrowser(world);
const phone = makePhone(world);
const taps = [];
const BOOK_TAPS = [{ f: 12, x: 346, y: 796 }, { f: 52, x: 153, y: 712 }, { f: 92, x: 232, y: 620 }, { f: 128, x: 192.5, y: 620 },
  { f: 160, x: 195, y: 526.9 }, { f: 182, x: 195, y: 578.9 }, { f: 205, x: 195, y: 630.9 }, { f: 226, x: 195, y: 709 }, { f: 262, x: 195, y: 673 }];
BOOK_TAPS.forEach(() => taps.push(tapIndicator(phone.taps)));
const ctaTap = tapIndicator(ui);

// Phone screen content per segment: [t0, t1, clip, frameAt(t)]
const SEG = [
  { t0: 1.6, t1: 4.0, clip: 'c_hero', f: (t) => (t - 1.9) * 30 },
  { t0: 5.6, t1: 8.0, clip: 'c_leist', f: (t) => (t - 5.7) * 30 },
  { t0: 8.0, t1: 10.0, clip: 'c_auto', f: (t) => (t - 7.6) * 30 },
  { t0: 10.0, t1: 12.0, clip: 'c_check', f: (t) => (t - 9.7) * 30 },
  { t0: 12.0, t1: 14.4, clip: 'c_team', f: (t) => (t - 11.7) * 30 },
  { t0: 15.3, t1: 32, clip: 'm_booking', f: (t) => (t - BOOK_T0) * 30 },
];
const SWAPS = [8.0, 10.0, 12.0]; // in-phone content changes (slide)

// Phone pose keyframes (smooth, calm)
const P = (t, cx, cy, s, rx, ry) => ({ t, cx, cy, s, rx, ry });
const PHONE_KEYS = [
  P(0, 540, 2900, 0.8, 24, -14),
  P(1.75, 540, 2700, 0.8, 22, -12),
  P(2.75, 540, 1150, 0.74, 6, -8),
  P(3.65, 540, 1135, 0.74, 5, -3),
  P(4.3, -700, 1135, 0.74, 5, 12),     // pushed out left
  P(4.31, 1780, 1135, 0.74, 5, -12),   // jump (off screen) to the right
  P(5.65, 1780, 1135, 0.74, 5, -12),
  P(6.35, 540, 1135, 0.74, 5, -6),
  P(7.8, 540, 1125, 0.74, 5, 4),
  P(8.3, 540, 1135, 0.74, 5, -5),
  P(9.8, 540, 1125, 0.74, 5, 4),
  P(10.3, 540, 1135, 0.74, 5, -5),
  P(11.8, 540, 1125, 0.74, 5, 4),
  P(12.3, 540, 1135, 0.74, 5, -5),
  P(13.7, 540, 1130, 0.74, 5, 2),
  P(14.35, 540, 2900, 0.74, 18, 4),    // leaves downward for the CTA
  P(15.5, 540, 2900, 0.8, 16, 0),
  P(16.25, 540, 1090, 0.8, 4, 0),      // booking: whole phone, launcher visible
  P(16.55, 540, 1090, 0.8, 4, 0),
];
function phonePose(t) {
  let a = PHONE_KEYS[0], b = PHONE_KEYS[PHONE_KEYS.length - 1];
  if (t >= b.t) return { ...b };
  for (let i = 0; i < PHONE_KEYS.length - 1; i++) if (t >= PHONE_KEYS[i].t && t < PHONE_KEYS[i + 1].t) { a = PHONE_KEYS[i]; b = PHONE_KEYS[i + 1]; break; }
  const k = E.inOut(prog(t, a.t, b.t));
  const o = {}; for (const key of ['cx', 'cy', 's', 'rx', 'ry']) o[key] = lerp(a[key], b[key], k);
  o.v = Math.abs(b.cx - a.cx) / Math.max(0.01, b.t - a.t) * (Math.sin(k * Math.PI));   // horizontal speed for motion blur
  return o;
}
// Booking camera: zoom into the widget, then back out for the confirmation
const CAM = [
  { t: 16.55, z: 0.8, fy: 422, py: 1090 },
  { t: 17.15, z: 1.25, fy: 422, py: 1000 },
  { t: DONE_T + 0.1, z: 1.25, fy: 422, py: 1000 },
  { t: DONE_T + 0.75, z: 0.86, fy: 440, py: 1260 },
  { t: 27.6, z: 0.86, fy: 440, py: 1250 },
];
function bookCam(t) {
  let a = CAM[0], b = CAM[CAM.length - 1];
  if (t >= b.t) return b;
  for (let i = 0; i < CAM.length - 1; i++) if (t >= CAM[i].t && t < CAM[i + 1].t) { a = CAM[i]; b = CAM[i + 1]; break; }
  const k = E.inOut(prog(t, a.t, b.t));
  return { z: lerp(a.z, b.z, k), fy: lerp(a.fy, b.fy, k), py: lerp(a.py, b.py, k) };
}

// Sound design (subtle)
sfx(2.2, 'whoosh', 0.8, { dur: 0.45 });
sfx(4.0, 'whoosh', 0.9, { dur: 0.35 }); sfx(6.0, 'whoosh', 0.9, { dur: 0.35 });
SWAPS.forEach((x) => sfx(x, 'swish', 0.8));
sfx(14.0, 'whoosh_down', 0.8, { dur: 0.35 });
sfx(14.55, 'soft_pop', 0.7);
sfx(15.4, 'click', 1.0);
sfx(15.9, 'whoosh', 0.8, { dur: 0.35 });
BOOK_TAPS.forEach((tp) => sfx(bt(tp.f), 'tap', 0.9));
[12, 52, 92, 128, 226].forEach((f) => sfx(bt(f) + 0.13, 'bubble', 0.7));
[[162, 14], [184, 15], [207, 12]].forEach(([f, n]) => { for (let k = 0; k < n; k++) sfx(bt(f + k), 'key', 0.6, { v: k }); });
STEPS.slice(1).forEach((s) => sfx(s.a, 'step', 0.6));
sfx(DONE_T + 0.5, 'success', 1.0);
sfx(28.02, 'whoosh', 0.7, { dur: 0.4 });
sfx(28.2, 'logo', 1.0);
sfx(29.6, 'soft_pop', 0.6);

// =====================================================================
//  Frame
// =====================================================================
const fade = document.getElementById('fade');
function renderFrame(t) {
  pending.length = 0;
  renderBg(t);
  titles.forEach((d) => renderTitle(d, t));
  titles[0].box.style.transform = `scale(${1 + t * 0.025})`;

  // ---------- browser (desktop hero, 4–6 s) ----------
  const bIn = E.inOut(prog(t, 3.65, 4.35)), bOut = E.inOut(prog(t, 5.65, 6.35));
  const bOn = t > 3.6 && t < 6.4;
  show(browser.root, bOn);
  if (bOn) {
    const cx = lerp(1700, 540, bIn) + lerp(0, -1240, bOut);
    const lt = t - 4.0;
    const v = Math.sin(bIn * Math.PI) + Math.sin(bOut * Math.PI);
    placeBrowser(browser, { cx, cy: 1080, s: 1.0 + lt * 0.015, rx: 7, ry: lerp(-14, 8, prog(t, 3.8, 6.2)), blur: v * 16 });
    setSrc(browser.img, clipURL('c_dhero', (t - 3.8) * 30));
  }

  // ---------- phone ----------
  const pose = phonePose(t);
  let cx = pose.cx, cy = pose.cy, s = pose.s, rx = pose.rx, ry = pose.ry;
  if (t >= 16.55) {
    const c = bookCam(t);
    s = c.z; cy = c.py - (c.fy - 422) * SCR * c.z; cx = 540; rx = 4 + Math.sin((t - 16.55) * 0.6) * 1.2; ry = Math.sin((t - 16.55) * 0.45) * 2.5;
  }
  // end: phone drifts down and fades for the end card
  const endK = E.inOut(prog(t, 27.7, 28.4));
  if (endK > 0) { cy += endK * 1500; rx += endK * 14; }
  const blur = Math.min(18, (pose.v || 0) / 170);
  placePhone(phone, { cx, cy, s, rx, ry, op: 1, blur: t < 16.55 ? blur : 0 });
  show(phone.root, t < 28.5);
  // screen content
  const seg = SEG.find((g) => t >= g.t0 && t < g.t1) || SEG[0];
  const sw = SWAPS.find((x) => t >= x - 0.3 && t < x + 0.35);
  if (sw) {
    const from = SEG.find((g) => g.t1 === sw), to = SEG.find((g) => g.t0 === sw);
    setScreen(phone, clipURL(from.clip, from.f(t)), clipURL(to.clip, to.f(t)), prog(t, sw - 0.3, sw + 0.35));
  } else setScreen(phone, clipURL(seg.clip, seg.f(t)), null, 0);

  // darken the top of the zoomed phone so the step titles stay readable
  scrim.style.opacity = E.inOut(prog(t, 16.6, 17.1)) * (1 - E.inOut(prog(t, DONE_T + 0.35, DONE_T + 0.8)));

  // taps inside the phone
  BOOK_TAPS.forEach((tp, i) => animTap(taps[i], t - bt(tp.f), tp.x * SCR, tp.y * SCR));

  // ---------- CTA (14–16 s) and end card ----------
  const ctaIn = E.outBackSoft(prog(t, 14.45, 15.05));
  const ctaPress = t > 15.4 ? 1 - 0.05 * Math.sin(Math.min(1, (t - 15.4) / 0.18) * Math.PI) : 1;
  const ctaOut = E.in(prog(t, 15.55, 15.9));
  const endCta = E.outBackSoft(prog(t, 29.45, 30.05));
  if (t < 20) {
    show(cta, t > 14.45 && t < 15.9);
    css(cta, { top: '1010px', opacity: clamp(prog(t, 14.45, 14.75)) * (1 - ctaOut), transform: `translateY(${(1 - ctaIn) * 40 - ctaOut * 30}px) scale(${ctaPress * (1 - ctaOut * 0.06)})` });
    css(ctaShine, { left: (-220 + E.inOut(prog(t, 14.9, 15.35)) * 1000) + 'px' });
    animTap(ctaTap, t - 15.4, 540 + 90, 1076);
  } else {
    show(cta, t > 29.45);
    css(cta, { top: '1160px', opacity: clamp(prog(t, 29.45, 29.75)), transform: `translateY(${(1 - endCta) * 40}px)` });
    css(ctaShine, { left: (-220 + E.inOut(prog(t, 30.3, 30.9)) * 1000) + 'px' });
    animTap(ctaTap, -9, 0, 0);
  }
  // success check (centered above the headline)
  const ck = prog(t, DONE_T + 0.45, DONE_T + 0.85);
  const ckOut = E.in(prog(t, 27.7, 28.0));
  show(check, ck > 0 && t < 28.05);
  css(check, { top: '150px', opacity: clamp(ck * 3) * (1 - ckOut), transform: `scale(${E.outBackSoft(ck) * (1 - ckOut * 0.1)})` });
  checkPath.style.strokeDashoffset = 1 - E.inOut(prog(t, DONE_T + 0.6, DONE_T + 1.0));

  // end card pieces
  const lk = E.outBackSoft(prog(t, 28.15, 28.75));
  show(endLogo, t > 28.15);
  css(endLogo, { opacity: clamp(prog(t, 28.15, 28.45)), transform: `translateY(${(1 - lk) * 50}px) scale(${0.9 + 0.1 * lk})` });
  optSpans.forEach((o, i) => { const k = E.out(prog(t, 29.05 + i * 0.12, 29.55 + i * 0.12)); o.style.opacity = k; o.style.transform = `translateY(${(1 - k) * 24}px)`; });
  show(opts, t > 29);
  const uk = E.out(prog(t, 29.9, 30.4)), hk = E.out(prog(t, 30.05, 30.55));
  css(url, { opacity: uk, transform: `translateY(${(1 - uk) * 20}px)` }); show(url, t > 29.9);
  css(handle, { opacity: hk, transform: `translateY(${(1 - hk) * 20}px)` }); show(handle, t > 30.0);

  return Promise.all(pending);
}
window.renderFrame = renderFrame;
window.SFX = SFX;
window.META = { FPS, DURATION, BPM };
}
window.ready = boot().then(() => true);
</script>
