<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Westfalia Digital Reel</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>
  :root { --royal: #1f6fff; --royal-light: #5b9bff; --navy: #071a35; --ink: #040b18; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ink); }
  body { font-family: Inter, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  #frame { position: absolute; inset: 0; overflow: hidden; }
  .layer { position: absolute; inset: 0; }

  #bg { background: linear-gradient(180deg, #0a1f40 0%, #071a35 38%, #040d1d 100%); }
  #backdrop { position: absolute; left: -270px; top: -300px; width: 1620px; height: 3505px; opacity: 0; filter: blur(46px) saturate(1.2); }
  #bgshade { background: linear-gradient(180deg, rgba(4,11,24,.55) 0%, rgba(4,11,24,.35) 45%, rgba(4,11,24,.75) 100%); }
  .glow { position: absolute; border-radius: 50%; }
  #vignette { background: radial-gradient(120% 85% at 50% 45%, rgba(0,0,0,0) 60%, rgba(0,0,0,.4) 100%); }
  #flash { background: #fff; opacity: 0; }

  .shot { position: absolute; inset: 0; }
  .phone { position: absolute; width: 736px; height: 1551px; border-radius: 104px; padding: 18px;
    background: linear-gradient(150deg, #3a4558 0%, #11161f 22%, #0b0f17 70%, #2a3345 100%);
    box-shadow: 0 90px 160px -40px rgba(0,0,0,.8), 0 0 0 2px #465368 inset, 0 0 0 1px #05070b; transform-origin: 50% 50%; }
  .phone .screen { position: relative; width: 700px; height: 1515px; border-radius: 86px; overflow: hidden; background: #0b1526; }
  .phone .screen img { position: absolute; left: 0; top: 0; width: 700px; height: 1515px; }
  .phone .island { position: absolute; left: 50%; top: 40px; width: 180px; height: 52px; margin-left: -90px; border-radius: 26px; background: #000; }
  .phone .btn { position: absolute; background: #222b3a; border-radius: 3px; }
  .glare { position: absolute; pointer-events: none; background: linear-gradient(115deg, rgba(255,255,255,0) 40%, rgba(255,255,255,.18) 50%, rgba(255,255,255,0) 60%); background-size: 300% 100%; }
  .phone .glare { inset: 18px; border-radius: 86px; }

  .browser { position: absolute; width: 980px; border-radius: 22px; overflow: hidden; background: #0e1b31; transform-origin: 50% 50%;
    box-shadow: 0 70px 140px -30px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.1); }
  .browser .bar { height: 58px; background: #15223a; display: flex; align-items: center; padding: 0 22px; gap: 10px; }
  .browser .bar i { width: 15px; height: 15px; border-radius: 50%; display: block; background: #34425c; }
  .browser .url { margin: 0 auto; width: 420px; height: 34px; border-radius: 17px; background: #0b1526; color: #b9ccef;
    font: 500 18px Inter; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .browser img { display: block; width: 980px; height: 612.5px; }
  .browser .glare { inset: 0; }
  .full { position: absolute; left: 0; top: 0; width: 1080px; height: 2337px; transform-origin: 540px 960px; }

  .title { position: absolute; left: 60px; right: 60px; text-align: center; }
  .eyebrow { font: 700 25px Inter; letter-spacing: .2em; color: #8db8ff; text-transform: uppercase; overflow: hidden; height: 34px; }
  .eyebrow span, .tl span { display: inline-block; will-change: transform; }
  .tl { overflow: hidden; font-family: Montserrat; font-weight: 800; letter-spacing: -.02em; line-height: 1.08; padding: 0 0 .1em; white-space: nowrap; }
  .tl b { font-weight: 800; color: var(--royal-light); }
  .sub { font: 500 30px Inter; color: rgba(214,228,255,.82); overflow: hidden; line-height: 1.35; white-space: nowrap; }
  .shadow .tl span { text-shadow: 0 8px 30px rgba(0,0,0,.45); }
  .progress { display: flex; gap: 10px; justify-content: center; margin: 18px 0 10px; }
  .progress i { display: block; width: 92px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.16); overflow: hidden; }
  .progress i b { display: block; height: 100%; width: 0; background: var(--royal-light); border-radius: 3px; }

  .cta { position: absolute; left: 540px; width: 660px; height: 132px; margin-left: -330px; border-radius: 66px;
    background: linear-gradient(180deg, #3a82ff 0%, #1f6fff 60%, #1a62e6 100%);
    display: flex; align-items: center; justify-content: center; gap: 22px; font: 800 48px Montserrat; letter-spacing: -.01em;
    box-shadow: 0 30px 70px -22px rgba(31,111,255,.85), inset 0 1px 0 rgba(255,255,255,.25); overflow: hidden; }
  .cta svg { width: 50px; height: 50px; }
  .shine { position: absolute; top: 0; bottom: 0; width: 160px; transform: skewX(-20deg);
    background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.4), rgba(255,255,255,0)); }
  .tap { position: absolute; width: 70px; height: 70px; margin: -35px 0 0 -35px; border-radius: 50%;
    background: rgba(255,255,255,.35); box-shadow: 0 0 0 3px rgba(255,255,255,.85), 0 6px 18px rgba(0,0,0,.25); }
  .tapring { position: absolute; border-radius: 50%; border: 3px solid rgba(255,255,255,.9); }
  .check { position: absolute; left: 480px; width: 120px; height: 120px; border-radius: 50%; background: #22c55e;
    box-shadow: 0 22px 50px -14px rgba(34,197,94,.75); }
  .check svg { position: absolute; left: 0; top: 0; width: 120px; height: 120px; }
  .ring { position: absolute; border-radius: 50%; border: 4px solid rgba(91,155,255,.8); }
  .opts { position: absolute; left: 0; right: 0; display: flex; justify-content: center; gap: 34px; font: 600 30px Inter; color: rgba(235,242,255,.92); }
  .opts span { display: inline-flex; align-items: center; gap: 12px; }
  .opts svg { width: 30px; height: 30px; color: #4ade80; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <filter id="mbA" x="-15%" y="-5%" width="130%" height="110%"><feGaussianBlur id="mbAStd" stdDeviation="0 0"/></filter>
  <filter id="mbB" x="-15%" y="-5%" width="130%" height="110%"><feGaussianBlur id="mbBStd" stdDeviation="0 0"/></filter>
</defs></svg>
<div id="frame">
  <div id="bg" class="layer"><img id="backdrop"><div id="bgshade" class="layer"></div></div>
  <div id="stage" class="layer"></div>
  <div id="ui" class="layer"></div>
  <div id="vignette" class="layer"></div>
  <div id="flash" class="layer"></div>
</div>
<script>
// =====================================================================
//  Timing: everything is placed on a 124 BPM grid
// =====================================================================
const FPS = 30, BPM = 124, B = 60 / BPM, BEATS = 48, DURATION = BEATS * B;
const b = (n) => n * B;
const CLIPS = { c_hero: 80, c_dhero: 80, c_leist: 80, c_auto: 80, c_check: 80, c_team: 80, m_booking: 330, d_leist: 50, m_system: 60 };
const SCR = 700 / 390;

const clamp = (v, a = 0, c = 1) => Math.min(c, Math.max(a, v));
const lerp = (a, c, k) => a + (c - a) * k;
const prog = (t, a, c) => clamp((t - a) / (c - a));
const E = {
  inOut: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
  out: (t) => 1 - Math.pow(1 - t, 3),
  in: (t) => t * t * t,
  outExpo: (t) => (t >= 1 ? 1 : 1 - Math.pow(2, -10 * t)),
  inExpo: (t) => (t <= 0 ? 0 : Math.pow(2, 10 * t - 10)),
  outBack: (t) => { const c1 = 1.3, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
};
const el = (tag, cls, parent, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (parent) parent.appendChild(e); return e; };
const css = (e, o) => { for (const k in o) e.style[k] = o[k]; };
const show = (e, on) => { e.style.display = on ? '' : 'none'; };
const clipURL = (n, i) => `clips/${n}/${String(clamp(Math.round(i), 0, CLIPS[n] - 1)).padStart(4, '0')}.jpg`;
const pending = [];
function setSrc(img, url) { if (img.dataset.src !== url) { img.dataset.src = url; img.src = url; pending.push(img.decode().catch(() => {})); } }
/** 1 on the beat, decaying quickly: drives the zoom punches. */
const pulse = (t) => { const ph = ((t % B) + B) % B; return Math.exp(-ph / 0.09); };

const ICON = {
  cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M8 3v4"/><path d="M16 3v4"/></svg>',
  tick: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.2 4.2L19 7"/></svg>',
  lock: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#7fa6e0" stroke-width="2.4" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
  logo: (s) => `<svg viewBox="0 0 48 48" width="${s}" height="${s}"><defs><linearGradient id="lg${s}" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#1657D6"/><stop offset="1" stop-color="#3D86FF"/></linearGradient></defs><circle cx="24" cy="24" r="24" fill="#F4F7FB"/><path d="M13 16 L19.5 33 L24 23 L28.5 33" fill="none" stroke="#0B1B33" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M28.5 33 L37 12" fill="none" stroke="url(#lg${s})" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
};

const SFX = [];
const sfx = (t, type, gain = 1, extra = {}) => SFX.push({ t: +t.toFixed(4), type, gain, ...extra });
const FLASH = [];

async function boot() {
await Promise.all(['600', '700', '800'].map((w) => document.fonts.load(`${w} 60px Montserrat`, 'ÄÖÜäöüß Termin'))
  .concat(['400', '500', '600', '700'].map((w) => document.fonts.load(`${w} 30px Inter`, 'westfaliadigital.de ÄÖÜ'))));
await document.fonts.ready;

const stage = document.getElementById('stage');
const ui = document.getElementById('ui');
const bg = document.getElementById('bg');
const backdrop = document.getElementById('backdrop');
const scrim = el('div', 'layer', ui);
scrim.style.background = 'linear-gradient(180deg, rgba(5,14,30,1) 0%, rgba(5,14,30,1) 28.8%, rgba(5,14,30,0) 31%)';

const glows = [
  { c: 'rgba(31,111,255,.42)', r: 700, x: 540, y: 1180, ax: 120, ay: 60, sp: 0.09 },
  { c: 'rgba(91,155,255,.20)', r: 520, x: 200, y: 320, ax: 80, ay: 50, sp: 0.07 },
].map((g) => { const d = el('div', 'glow', bg); css(d, { width: 2 * g.r + 'px', height: 2 * g.r + 'px', background: `radial-gradient(closest-side, ${g.c}, rgba(0,0,0,0))` }); return { ...g, d }; });
bg.appendChild(document.getElementById('bgshade'));

// ---------------------------------------------------------------------
//  Titles (masked reveals)
// ---------------------------------------------------------------------
const titles = [];
function title(def) {
  const box = el('div', 'title shadow', ui);
  box.style.top = def.y + 'px';
  const parts = [];
  const sp = def.speed || 1;
  if (def.eyebrow) { const e = el('div', 'eyebrow', box); parts.push({ span: el('span', '', e, def.eyebrow), d: 0 }); }
  if (def.progress) { const p = el('div', 'progress', box); def.bars = []; for (let i = 0; i < 5; i++) def.bars.push(el('b', '', el('i', '', p))); parts.push({ span: p, d: 0.02, fadeOnly: true }); }
  const lineEls = def.lines.map((h, i) => { const l = el('div', 'tl', box); l.style.fontSize = (def.size || 84) + 'px'; const s = el('span', '', l, h); parts.push({ span: s, d: (def.lineDelays ? def.lineDelays[i] : 0.05 + i * 0.06), pop: def.pop }); return l; });
  if (def.sub) { const s = el('div', 'sub', box); s.style.marginTop = '14px'; parts.push({ span: el('span', '', s, def.sub), d: 0.15 }); }
  let fs = def.size || 84;
  while (lineEls.some((l) => l.firstChild.offsetWidth > 960) && fs > 40) { fs -= 2; lineEls.forEach((l) => (l.style.fontSize = fs + 'px')); }
  def.box = box; def.parts = parts; def.sp = sp; titles.push(def); return def;
}
function renderTitle(d, t) {
  const on = t >= d.t0 - 0.01 && t < d.t1 + 0.4;
  show(d.box, on); if (!on) return;
  for (const p of d.parts) {
    const kin = E.outExpo(prog(t, d.t0 + p.d, d.t0 + p.d + 0.55 / d.sp));
    const kout = E.in(prog(t, d.t1, d.t1 + 0.22));
    if (p.fadeOnly) { p.span.style.opacity = kin * (1 - kout); continue; }
    let tf = `translateY(${(1 - kin) * 105 - kout * 105}%)`;
    if (p.pop) tf += ` scale(${1 + (1 - kin) * 0.25})`;
    p.span.style.transform = tf;
  }
  if (d.progress) d.bars.forEach((bb, i) => { const st = d.progress[i]; bb.style.width = (st != null ? E.inOut(prog(t, st, st + 0.3)) * 100 : 0) + '%'; });
}

// ---------------------------------------------------------------------
//  Devices
// ---------------------------------------------------------------------
function makePhone(parent) {
  const p = el('div', 'phone', parent);
  const scr = el('div', 'screen', p);
  const img = el('img', '', scr);
  const taps = el('div', 'layer', scr);
  el('div', 'island', p);
  [[300, 110], [440, 110]].forEach(([y, h]) => { const d = el('div', 'btn', p); css(d, { left: '-5px', top: y + 'px', width: '5px', height: h + 'px' }); });
  { const d = el('div', 'btn', p); css(d, { right: '-5px', top: '360px', width: '5px', height: '170px' }); }
  const glare = el('div', 'glare', p);
  return { root: p, img, taps, glare, kind: 'phone' };
}
function makeBrowser(parent) {
  const br = el('div', 'browser', parent);
  const bar = el('div', 'bar', br); el('i', '', bar); el('i', '', bar); el('i', '', bar);
  el('div', 'url', bar, ICON.lock + 'westfaliadigital.de');
  const img = el('img', '', br);
  const glare = el('div', 'glare', br);
  return { root: br, img, glare, kind: 'browser' };
}
function makeFull(parent) { const img = el('img', 'full', parent); const sh = el('div', 'layer', parent); sh.style.background = 'linear-gradient(180deg, rgba(4,11,24,1) 0%, rgba(4,11,24,.98) 38%, rgba(4,11,24,0) 50%, rgba(4,11,24,0) 76%, rgba(4,11,24,.98) 86%, rgba(4,11,24,1) 100%)'; return { root: img, img, kind: 'full' }; }
function place(dev, { cx = 540, cy = 1140, s = 1, rx = 0, ry = 0, rz = 0, op = 1 }) {
  if (dev.kind === 'full') { css(dev.root, { transform: `translateY(-160px) scale(${s})`, opacity: op }); return; }
  const w = dev.kind === 'phone' ? 736 : 980, h = dev.kind === 'phone' ? 1551 : 670;
  css(dev.root, { left: (cx - w / 2) + 'px', top: (cy - h / 2) + 'px', opacity: op,
    transform: `perspective(3000px) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg) scale(${s})` });
}
function tapIndicator(parent) { return { d: el('div', 'tap', parent), r: el('div', 'tapring', parent) }; }
function animTap(tp, lt, x, y) {
  const vis = lt > -0.18 && lt < 0.42;
  show(tp.d, vis); show(tp.r, vis && lt > 0); if (!vis) return;
  const a = E.out(prog(lt, -0.18, 0));
  const press = lt >= 0 ? 1 - 0.14 * Math.sin(Math.min(1, lt / 0.14) * Math.PI) : 1;
  const out = prog(lt, 0.2, 0.42);
  css(tp.d, { left: x + 'px', top: y + 'px', opacity: a * (1 - out), transform: `scale(${lerp(1.3, 1, a) * press})` });
  const rk = E.out(prog(lt, 0, 0.4)), R = 34 + rk * 64;
  css(tp.r, { left: (x - R) + 'px', top: (y - R) + 'px', width: 2 * R + 'px', height: 2 * R + 'px', opacity: (1 - rk) * 0.85 });
}

// =====================================================================
//  Shots
// =====================================================================
// enter/exit: 'rise' | 'whipL' | 'whipR' (moves toward left/right) | 'punch' (hard cut with zoom) | 'zoom' (zoom through) | 'drop'
const shots = [];
let mbToggle = 0;
function shot(def) {
  const root = el('div', 'shot', stage);
  def.root = root;
  def.dev = def.kind === 'phone' ? makePhone(root) : def.kind === 'browser' ? makeBrowser(root) : makeFull(root);
  def.filter = mbToggle++ % 2 ? 'mbB' : 'mbA';
  shots.push(def); return def;
}
const T_IN = 0.16, T_OUT = 0.13;
function transform(def, t) {
  // returns extra offsets for enter/exit
  let dx = 0, dy = 0, sc = 1, blur = 0, op = 1;
  const ki = prog(t, def.t0, def.t0 + (def.enter === 'rise' ? 0.55 : T_IN));
  const ko = prog(t, def.t1 - T_OUT, def.t1);
  switch (def.enter) {
    case 'rise': { const e = E.outExpo(ki); dy += (1 - e) * 1500; break; }
    case 'whipL': { const e = 1 - E.out(ki); dx += e * 1300; blur = Math.max(blur, e * 60); break; }
    case 'whipR': { const e = 1 - E.out(ki); dx -= e * 1300; blur = Math.max(blur, e * 60); break; }
    case 'punch': { const e = E.outExpo(ki); sc *= lerp(1.12, 1, e); break; }
    case 'zoom': { const e = E.outExpo(ki); sc *= lerp(0.7, 1, e); op *= clamp(ki * 3); break; }
  }
  switch (def.exit) {
    case 'whipL': { const e = E.in(ko); dx -= e * 1300; blur = Math.max(blur, e * 60); break; }
    case 'whipR': { const e = E.in(ko); dx += e * 1300; blur = Math.max(blur, e * 60); break; }
    case 'zoom': { const e = E.inExpo(ko); sc *= 1 + e * 1.8; op *= 1 - e; break; }
    case 'drop': { const e = E.in(prog(t, def.t1 - 0.3, def.t1)); dy += e * 1600; break; }
  }
  return { dx, dy, sc, blur, op };
}

// ---- tour shots (beats) ----
const PH = { cx: 540, cy: 1140, s: 0.74 };
const tour = [
  { b0: 3.75, b1: 6, kind: 'phone', clip: 'c_hero', f: (lt) => 8 + lt * 30, enter: 'rise', exit: 'whipL', ry0: -10, ry1: 6 },
  { b0: 6, b1: 8, kind: 'browser', clip: 'c_dhero', f: (lt) => 25 + lt * 30, enter: 'whipL', exit: 'punchOut', ry0: -14, ry1: 6 },
  { b0: 8, b1: 9, kind: 'phone', clip: 'c_leist', f: (lt) => 10 + lt * 40, enter: 'punch', ry0: -8, ry1: -3 },
  { b0: 9, b1: 10, kind: 'browser', clip: 'd_leist', f: (lt) => 34 + lt * 30, enter: 'punch', ry0: 10, ry1: 6 },
  { b0: 10, b1: 11, kind: 'phone', clip: 'c_auto', f: (lt) => 10 + lt * 40, enter: 'punch', ry0: 8, ry1: 3 },
  { b0: 11, b1: 12, kind: 'full', clip: 'm_system', f: (lt) => 27 + lt * 14, enter: 'punch', exit: 'whipL' },
  { b0: 12, b1: 14, kind: 'phone', clip: 'c_check', f: (lt) => 18 + lt * 36, enter: 'whipL', exit: 'whipL', ry0: -10, ry1: 6 },
  { b0: 14, b1: 16, kind: 'phone', clip: 'c_team', f: (lt) => 12 + lt * 36, enter: 'whipL', exit: 'drop', ry0: -8, ry1: 8 },
].map((s) => shot({ ...s, t0: b(s.b0), t1: b(s.b1) }));

// ---- booking shot (one phone, camera cuts per step) ----
// clip frame → beat anchors: every tap lands on a beat
const MAP = [[0, 20.2], [12, 21], [52, 23], [92, 25], [128, 27], [160, 29], [182, 31], [205, 33], [226, 35], [262, 36.5], [270, 37], [330, 40.5]];
function bookFrame(t) {
  const x = t / B;
  if (x <= MAP[0][1]) return 0;
  for (let i = 0; i < MAP.length - 1; i++) if (x <= MAP[i + 1][1]) return lerp(MAP[i][0], MAP[i + 1][0], (x - MAP[i][1]) / (MAP[i + 1][1] - MAP[i][1]));
  return 329;
}
const tapBeat = (f) => MAP.find((m) => m[0] === f)[1];
const book = shot({ t0: b(19.6), t1: b(40.4), kind: 'phone', clip: 'm_booking', enter: 'zoom', exit: 'drop' });
const BOOK_TAPS = [{ f: 12, x: 346, y: 796 }, { f: 52, x: 153, y: 712 }, { f: 92, x: 232, y: 620 }, { f: 128, x: 192.5, y: 620 },
  { f: 160, x: 195, y: 526.9 }, { f: 182, x: 195, y: 578.9 }, { f: 205, x: 195, y: 630.9 }, { f: 226, x: 195, y: 709 }, { f: 262, x: 195, y: 673 }];
const taps = BOOK_TAPS.map(() => tapIndicator(book.dev.taps));
// camera framings: [beat, zoom, focus-y (site px), screen-y of focus]
const CAM = [[19.6, 0.8, 422, 1090], [21.25, 1.25, 470, 1160], [23.2, 1.42, 610, 1230], [25.2, 1.42, 610, 1230], [27.2, 1.42, 600, 1250],
  [31.1, 1.42, 620, 1250], [33.1, 1.42, 640, 1250], [35.15, 1.3, 540, 1180], [37.1, 0.86, 440, 1260]];
function camAt(t) {
  const x = t / B; let a = CAM[0], c = CAM[0];
  for (let i = 0; i < CAM.length; i++) if (x >= CAM[i][0]) { a = CAM[i]; c = CAM[i + 1] || CAM[i]; }
  const k = E.outExpo(prog(x, a[0], a[0] + 0.55)); // snap into each framing
  const p = CAM[CAM.indexOf(a) - 1] || a;
  return { z: lerp(p[1], a[1], k), fy: lerp(p[2], a[2], k), py: lerp(p[3], a[3], k) };
}

// =====================================================================
//  Titles
// =====================================================================
const TOP = 200;
title({ t0: -0.3, t1: b(3.55), y: 690, eyebrow: 'Westfalia Digital', lines: ['Ihre Website bringt', 'keine <b>Anfragen?</b>'], lineDelays: [0.05, b(1) + 0.3], size: 100 });

function renderFrame(t) {
  pending.length = 0;

    const on = t >= s.t0 && t < s.t1;
    show(s.root, on); if (!on) continue;
    const lt = t - s.t0, dur = s.t1 - s.t0, k = lt / dur;

    if (s === book) continue; // handled below

    setSrc(s.dev.img, url_); backdropSrc = url_;
    const ry = lerp(s.ry0 || 0, s.ry1 || 0, E.inOut(k));
    if (s.kind === 'phone') place(s.dev, { cx: PH.cx + tr.dx, cy: PH.cy + tr.dy, s: PH.s * tr.sc * (1 + pz * 0.02) * (1 + lt * 0.02), rx: 5, ry, op: tr.op });

    if (s.dev.glare) s.dev.glare.style.backgroundPosition = `${lerp(110, -10, E.inOut(clamp(lt / 0.6)))}% 0`;
    s.root.style.filter = tr.blur > 1 ? `url(#${s.filter})` : 'none';
    if (tr.blur > 1) document.getElementById(s.filter + 'Std').setAttribute('stdDeviation', `${Math.min(tr.blur, 60)} 0`);
  }

  // ---------- booking ----------
  if (t >= book.t0 && t < book.t1) {
    const tr = transform(book, t);
    const f = bookFrame(t);
    const url_ = clipURL('m_booking', f); setSrc(book.dev.img, url_); backdropSrc = url_;
    const c = camAt(t);
    const zz = c.z * tr.sc * (1 + pz * 0.012);
    const cy = c.py - (c.fy - 422) * SCR * zz + tr.dy;
    const lt = t - book.t0;
    place(book.dev, { cx: 540, cy, s: zz, rx: 3 + Math.sin(lt * 0.8) * 1.2, ry: Math.sin(lt * 0.6) * 2.5, op: tr.op });
    book.dev.glare.style.backgroundPosition = `${lerp(110, -10, E.inOut(clamp(lt / 0.7)))}% 0`;
    BOOK_TAPS.forEach((tp, i) => animTap(taps[i], t - b(tapBeat(tp.f)), tp.x * SCR, tp.y * SCR));
  }
  scrim.style.opacity = E.inOut(prog(t, b(21), b(21.4))) * (1 - E.inOut(prog(t, DONE + 0.1, DONE + 0.45)));

  // blurred backdrop taken from the current screen
  if (backdropSrc) { setSrc(backdrop, backdropSrc); backdrop.style.opacity = 0.28; } else backdrop.style.opacity = 0;

  // ---------- CTA before the booking ----------
  const cIn = E.outBack(prog(t, b(16.5), b(16.5) + 0.45));
  const press = t > b(19) ? 1 - 0.06 * Math.sin(Math.min(1, (t - b(19)) / 0.16) * Math.PI) : 1;
  const zoomOut = E.inExpo(prog(t, b(19.2), b(20)));
  if (t < b(30)) {
    show(cta, t > b(16.5) && t < b(20));
    css(cta, { top: '1010px', opacity: clamp(prog(t, b(16.5), b(16.5) + 0.2)) * (1 - clamp(zoomOut * 2.2)), transform: `scale(${cIn * press * (1 + zoomOut * 2.5)})` });

    animTap(ctaTap, t - b(19), 630, 1076);
    const rp = ((t - b(17)) / B) % 1; show(ctaRing, t > b(17) && t < b(19));
    { const w = 660 + rp * 120, h = 132 + rp * 120; css(ctaRing, { left: (540 - w / 2) + 'px', top: (1076 - h / 2) + 'px', width: w + 'px', height: h + 'px', opacity: (1 - rp) * 0.6, borderRadius: '999px' }); }

    css(cta, { top: '1160px', opacity: clamp(prog(t, E0 + b(3), E0 + b(3) + 0.2)), transform: `scale(${eIn * (1 + pz * 0.025)})` });
    css(ctaShine, { left: (-220 + E.inOut(prog(t, E0 + b(4.5), E0 + b(6))) * 1000) + 'px' });
    animTap(ctaTap, -9, 0, 0);
    const rp = ((t - E0 - b(4)) / B / 2) % 1; show(ctaRing, t > E0 + b(4));

  const ck = prog(t, DONE + 0.2, DONE + 0.55);
  const ckOut = E.in(prog(t, b(40.1), b(40.1) + 0.2));
  show(check, ck > 0 && t < b(40.1) + 0.25);
  css(check, { top: '150px', opacity: clamp(ck * 3) * (1 - ckOut), transform: `scale(${E.outBack(ck) * (1 - ckOut * 0.1)})` });
  checkPath.style.strokeDashoffset = 1 - E.inOut(prog(t, DONE + 0.35, DONE + 0.7));
  const rk = prog(t, DONE + 0.3, DONE + 0.9); show(checkRing, rk > 0 && rk < 1);
  { const R = 60 + E.out(rk) * 110; css(checkRing, { left: (540 - R) + 'px', top: (210 - R) + 'px', width: 2 * R + 'px', height: 2 * R + 'px', opacity: (1 - rk) * 0.8 }); }

  // ---------- end card ----------
  const lk = E.outBack(prog(t, E0, E0 + 0.5));
  show(endLogo, t > E0);
  css(endLogo, { opacity: clamp(prog(t, E0, E0 + 0.2)), transform: `scale(${lk * (1 + pz * 0.03)})` });

  flash.style.opacity = fl;
  return Promise.all(pending);
}
